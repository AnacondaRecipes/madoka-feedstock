{% set name = "madoka" %}
{% set version = "0.7.2.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: a594f7acd173bc92928c9661ff92ba8b77ac85f2d7697f05ebb07f03184b4a08

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('cxx') }}
  host:
    - pip
    - python
    - setuptools
    - wheel
  run:
    - python

test:
  imports:
    - madoka
  commands:
    - pip check
  requires:
    - pip
    - python

about:
  home: https://github.com/ikegami-yukino/madoka-python
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Memory-efficient CountMin Sketch key-value structure (based on Madoka C++ library)
  description: Memory-efficient CountMin Sketch key-value structure (based on Madoka C++ library)
  doc_url: https://github.com/ikegami-yukino/madoka-python
  dev_url: https://github.com/ikegami-yukino/madoka-python

extra:
  recipe-maintainers:
    - jan-janssen
